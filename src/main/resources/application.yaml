server:
  port: ${PORT:8080}

spring:
  application:
    name: campushub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campushub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:campushub_secret_key_campushub_secret_key_123456}
  firebase:
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:campushub-67b2b.appspot.com}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
