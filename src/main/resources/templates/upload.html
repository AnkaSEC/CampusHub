<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusHub - Belge Yükleme</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 40px; }
        .card { background: white; max-width: 400px; margin: auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], input[type="file"] { width: 100%; box-sizing: border-box; padding: 8px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Öğrenci Belgesi Yükleme</h2>

    <form action="/api/v1/verifications/upload" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="userId">Kullanıcı ID (User ID):</label>
            <input type="number" id="userId" name="userId" required>
        </div>

        <div class="form-group">
            <label for="file">PDF Dosyası:</label>
            <input type="file" id="file" name="file" accept="application/pdf" required>
        </div>

        <button type="submit">Yükle</button>
    </form>
</div>

</body>
</html>
